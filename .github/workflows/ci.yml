name: CI

# Runs on every push and pull request, and is reused by the release workflow so a release can
# never be built from code that hasn't passed the same checks.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS (Bookworm); 3.13 = current Debian / newer systems.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  smoke:
    name: Boots and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci && npm run build
      - name: Smoke test
        run: scripts/smoke-test.sh "$GITHUB_WORKSPACE"

  installer:
    # The real thing, on a clean Ubuntu machine with systemd: apt packages, a Python environment,
    # a service on port 80, /var/lib/recipes — exactly what a first-time installer runs.
    name: Installer on a clean machine (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [checkout, package]   # a git clone, and an unpacked release package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Get the app folder ready
        run: |
          if [[ "${{ matrix.source }}" == package ]]; then
            scripts/build-release.sh v0.0.0-ci
            mkdir "$HOME/unpacked"
            tar -xzf dist-release/pi-recipe-site-v0.0.0-ci.tar.gz -C "$HOME/unpacked"
            echo "APP=$HOME/unpacked/pi-recipe-site-v0.0.0-ci" >> "$GITHUB_ENV"
          else
            echo "APP=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Install
        run: cd "$APP" && ./install.sh
      - name: The service is running, enabled at boot, and serving the app
        run: |
          systemctl is-active --quiet recipes
          systemctl is-enabled --quiet recipes
          curl -fsS http://localhost/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost/ | grep -q 'id="root"'
          test -f /var/lib/recipes/recipes.db
      - name: Running the installer again is safe and keeps your settings
        run: |
          echo "HOME_CITY=Austin" >> "$APP/.env"
          before=$(sha256sum "$APP/.env")
          cd "$APP" && ./install.sh
          [[ "$before" == "$(sha256sum "$APP/.env")" ]] || { echo "::error::re-running changed .env"; exit 1; }
          curl -fsS http://localhost/api/health | grep -q '"status":"ok"'
      - name: The service comes back by itself after a crash
        run: |
          sudo systemctl kill -s KILL recipes
          for _ in $(seq 1 30); do
            curl -fsS http://localhost/api/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::the service did not restart after being killed"; exit 1
      - name: The auto-restart timer brings the app back after its drive returns
        run: |
          # Forced on here; on a real Pi it's installed only when the app folder is on a separate drive.
          cd "$APP" && RECIPES_RETRY_UNITS=1 ./install.sh
          systemctl is-enabled recipes-retry.timer
          # Simulate "the app didn't start because its drive wasn't there": it's stopped; the check starts it.
          sudo systemctl stop recipes
          sudo systemctl start recipes-retry.service
          for _ in $(seq 1 30); do
            curl -fsS http://localhost/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost/api/health | grep -q '"status":"ok"'
          # ...but if the owner turned the app off on purpose, the check must leave it off.
          sudo systemctl disable --now recipes
          sudo systemctl start recipes-retry.service
          sleep 4
          ! curl -fsS http://localhost/api/health >/dev/null 2>&1
          sudo systemctl enable --now recipes
      - name: Moving the app onto the memory card keeps it running from the new place
        run: |
          cd "$APP" && RECIPES_DEST=/opt/pi-recipe-ci ./scripts/move-app-local.sh
          systemctl show recipes -p ExecStart --value | grep -q /opt/pi-recipe-ci
          curl -fsS http://localhost/api/health | grep -q '"status":"ok"'
          test ! -e /opt/pi-recipe-ci/frontend/node_modules
          test -L /usr/local/bin/recipes-update
          test -f /var/lib/recipes/recipes.db
          # The auto-restart timer is only for apps on a separate drive, so the move removes it.
          ! test -e /etc/systemd/system/recipes-retry.timer
      - name: Uninstall removes the service but keeps the data
        run: |
          cd "$APP" && ./install.sh --uninstall
          ! systemctl list-unit-files recipes.service | grep -q '^recipes.service'
          ! test -e /etc/systemd/system/recipes-retry.timer
          test -f /var/lib/recipes/recipes.db
      - name: Show the service log if anything above failed
        if: failure()
        run: sudo journalctl -u recipes -n 60 --no-pager || true
