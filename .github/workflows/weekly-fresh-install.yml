name: Weekly fresh install check

# The backend's dependencies are version RANGES, so a new release of any library can break a
# brand-new install without any change in this repo (that's how the Google sign-in broke).
# Once a week, install everything from scratch — no caches — and make sure the app still works,
# so a problem shows up here before a first-time installer hits it.
# If it fails, GitHub emails whoever last edited this schedule.
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    name: Fresh install (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}   # deliberately no pip cache
      - uses: actions/setup-node@v4
        with:
          node-version: "20"                      # deliberately no npm cache
      - name: Install the latest allowed versions of everything
        run: python -m pip install --no-cache-dir -r backend/requirements.txt
      - name: Show what was installed
        run: python -m pip list
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Build the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Smoke test
        run: scripts/smoke-test.sh "$GITHUB_WORKSPACE"
