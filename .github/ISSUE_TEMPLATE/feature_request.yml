name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a hobby project provided **as is** — no promise a request will be built, but ideas are welcome.
        The app is deliberately **home-network only, with no login and no HTTPS** (see the README),
        so requests that need it exposed to the internet are unlikely to fit.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the moment it comes up, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: false
